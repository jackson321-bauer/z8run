[package]
name = "kv-login"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = "0.5"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
data-encoding = "2"
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "pem", "arithmetic"] }
ml-kem = { version = "0.2", features = ["deterministic"] }
kem = "0.3.0-pre.0"
rand_core = "0.6"
rand = "0.8"
zeroize = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
kv-store = { path = "../kv-store" }

[features]
default = ["wp-nur-kern"]
wp-nur-kern = []

[profile.release]
lto = true
