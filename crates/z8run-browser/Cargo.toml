[package]
name = "z8run-browser"
description = "Browser-Kern (Worker): SQLite+vec in WASM, OPFS, S3, Fassade"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# NUR fuer Browser-Tests: Inline-Hashdatei/Test-Welt. Wird beim echten
# Bündelbau (z8-export) NICHT aktiviert -> kein Login-Hintertürchen.
test-login = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
zeroize = { workspace = true }
data-encoding = "2"
async-trait = { workspace = true }
# ECHTER Kern (target-sauber) auch im Browser: gleiche Token-/Session-/App-
# Logik wie nativ; nur die Adapter (DB/Storage) sind Browser-Implementierungen.
proxy-kern = { workspace = true }
z8run-core = { path = "../../crates/z8run-core", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
sqlite-wasm-rs = "0.5.5"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
aes-gcm = { workspace = true }
hkdf = { workspace = true }
rand = { workspace = true }
getrandom = { version = "0.2", features = ["js"] }
# Passbox-Login: Argon2id + ECIES-P256 wie die native Kette (kette.rs).
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
p256 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "pem", "arithmetic"] }
# /3-Login: HW-Boxen sind v3 hybrid (ECC + ML-KEM-1024). Die Umschlag-
# Krypto kommt per #[path] aus der EINEN Quelle (tresor-proxy/umschlag.rs),
# genau wie im nativen kette.rs — kein Drift.
ml-kem = { version = "0.2", features = ["deterministic"] }
kem = "0.3.0-pre.0"
rand_core = "0.6"
# wasmi = App-Laufzeit IM Worker (Wasmtime bleibt nativ). Btree-Collections,
# weil wasm32-unknown-unknown keine Random-Quelle fuer Hash-Maps garantiert.
wasmi = { version = "2.0.0", default-features = false, features = ["std", "validate", "memory64", "prefer-btree-collections", "portable-dispatch"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
wat = "1.262"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[build-dependencies]
cc = "1"
